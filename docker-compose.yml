services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: factory-batch-energy:latest
    ports:
      - "8000:8000"
    environment:
      CARBON_DB_PATH: /data/carbon.db
      LOG_LEVEL: INFO
    volumes:
      - carbon-data:/data
    restart: unless-stopped

volumes:
  carbon-data:
